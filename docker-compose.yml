# Base de datos local para desarrollo: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: knowsis-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: knowsis
      MYSQL_USER: knowsis
      MYSQL_PASSWORD: knowsis
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - knowsis-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  knowsis-data:
